<script>
  const container = document.querySelector('.reveal-container');
  const follower = document.getElementById('follower');

  // efekt działa tylko wtedy, gdy urządzenie obsługuje myszkę (hover)
  container.addEventListener('mousemove', (e) => {
    const rect = container.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    follower.style.left = `${x - follower.offsetWidth / 2}px`;
    follower.style.top = `${y - follower.offsetHeight / 2}px`;
  });
</script>


<script>
  // znajdujemy wszystkie grupy etykiet
  document.querySelectorAll('.label-group').forEach(group => {
    // dodajemy obsługę kliknięcia/tąpnięcia
    group.addEventListener('click', function(e) {
      // jeśli klikamy na telefonie, nie chcemy żeby od razu chowało opis
      e.stopPropagation();
      
      // sprawdzamy czy ta etykieta jest już otwarta
      const isOpen = this.classList.contains('active');
      
      // zamykamy wszystkie inne otwarte opisy, żeby nie nakładały się na siebie
      document.querySelectorAll('.label-group').forEach(g => g.classList.remove('active'));
      
      // jeśli nie była otwarta – otwieramy ją
      if (!isOpen) {
        this.classList.add('active');
      } else {
        this.classList.remove('active');
      }
    });
  });

  // kliknięcie gdziekolwiek indziej na stronie zamyka otwarty opis
  document.addEventListener('click', () => {
    document.querySelectorAll('.label-group').forEach(g => g.classList.remove('active'));
  });
</script>
